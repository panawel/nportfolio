<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="db-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Database Cylinder Bottom -->
  <path d="M24,96 C24,107 42,116 64,116 C86,116 104,107 104,96 L104,80 C104,91 86,100 64,100 C42,100 24,91 24,80 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
  
  <!-- Database Cylinder Middle -->
  <path d="M24,76 C24,87 42,96 64,96 C86,96 104,87 104,76 L104,60 C104,71 86,80 64,80 C42,80 24,71 24,60 Z" fill="#475569" stroke="#64748b" stroke-width="2"/>
  
  <!-- Database Cylinder Top -->
  <path d="M24,56 C24,67 42,76 64,76 C86,76 104,67 104,56 L104,40 C104,51 86,60 64,60 C42,60 24,51 24,40 Z" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Top Surface -->
  <ellipse cx="64" cy="40" rx="40" ry="16" fill="url(#db-gradient)" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- SQL Text -->
  <text x="64" y="88" font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="#f8fafc" text-anchor="middle" filter="url(#glow)" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">SQL</text>
</svg>
